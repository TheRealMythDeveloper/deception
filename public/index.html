
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeSception | Crescent</title>
</head>
<body>

    <h1>DeSception</h1>
    <p>Two minds. Two secrets. Five questions.</p>

    <hr>

    <h2>Player</h2>

    <input id="name" placeholder="Your name" maxlength="20">

    <h2>Create Lobby</h2>
    <button onclick="createLobby()">Create Lobby</button>

    <h2>Join Lobby</h2>
    <input id="code" placeholder="Lobby code" maxlength="5">
    <button onclick="joinLobby()">Join Lobby</button>

    <h2>Players</h2>
    <ul id="players"></ul>

    <button onclick="readyUp()">Ready</button>

    <p id="status">Connecting...</p>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/main.js"></script>

</body>
</html>
